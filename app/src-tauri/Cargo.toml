[package]
name = "love-life-app"
version = "0.1.0"
description = "情侣生活记录 APP"
edition = "2021"

[lib]
name = "love_life_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package]
name = "love-life-app"
version = "0.1.3"
description = "情侣生活记录 APP"
edition = "2021"

[lib]
name = "love_life_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# 媒体另存到本机：dialog = 系统「另存为」，fs = 写入所选文件（见 src/lib.rs 与 capabilities/default.json）
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 应用内更新：Rust 只做薄转发（命令 → Kotlin），下载引擎/前台服务/安装全在 Kotlin
# （避免 reqwest+ring 的交叉 C 编译依赖；sha256/Range 用平台 MessageDigest/HttpURLConnection，见 src/appupdate.rs）
